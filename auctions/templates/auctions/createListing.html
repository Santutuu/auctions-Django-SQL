{% extends "auctions/layout.html" %}
{% load static %}

{% block head %}
    
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-...tu_hash..." crossorigin="anonymous">
    <link href="{% static 'auctions/publicar.css' %}" rel="stylesheet">
    
{% endblock %}

{% block body %}
    
    <form action="{% url 'create' %}" method="post" enctype="multipart/form-data">
        {% csrf_token %}

        <section class="entradas">

            

            <div class="entrada">
                <label for="{{ form.titulo.id_for_label }}"><b>{{ form.titulo.label }}</b></label>
                {{ form.titulo }}
            </div>

            <div class="entrada">
                <b>{{ form.categoria.label_tag }}</b>
                {{ form.categoria }} 
            </div>
            
            <div class="entrada">
                <label for="{{ form.descripcion.id_for_label }}"><b>{{ form.descripcion.label }}</b></label>
                {{ form.descripcion }}
            </div>

            <div class="entrada">
                <label for="{{ form.imagen.id_for_label }}"><b>{{ form.imagen.label }}</b></label>
                {{ form.imagen }}
            </div>


            
            <div class="entrada">
                <label for="{{ form.oferta_inicial.id_for_label }}"><b>{{ form.ofertaInicial.label }}</b></label>
                {{ form.ofertaInicial }}
            </div>

            <button type="button" class="btn btn-outline-success">Publicar</button>
        </section>

    </form>





{% endblock %}
