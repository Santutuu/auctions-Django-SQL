{% extends "auctions/layout.html" %}
{% load static %}

{% block head %}
    <link href="{% static 'auctions/autenticate.css' %}" rel="stylesheet">
{% endblock %}

{% block body %}

    <section class="autenticate">
    <h2 class="letrita">Bienvenido</h2>

    {% if message %}
        <div>{{ message }}</div>
    {% endif %}

    
        <form action="{% url 'login' %}" method="post">
            {% csrf_token %}
            <div class="form-group">
                <input autofocus class="form-control" type="text" name="username" placeholder="Username">
            </div>
            <div class="form-group">
                <input class="form-control" type="password" name="password" placeholder="Password">
            </div>
            <input class="btn btn-secondary" type="submit" value="Login">
        </form>
    

        <div class="letrita2">
            Don't have an account? <a href="{% url 'register' %}"><b>Register here.</b></a>
        </div>
    </section>
{% endblock %}
